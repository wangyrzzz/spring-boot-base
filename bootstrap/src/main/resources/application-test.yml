server:
  port: 8080


spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/spring_boot_base?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username:
    password:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 64
      max-wait: 1200
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      password:
      timeout: 2s
      lettuce:
        shutdown-timeout: 100ms
        pool:
          max-active: 8
          max-idle: 8
          max-wait: 30s
          min-idle: 0

sys:
  infra:
    redis:
      enabled: false
    rabbitmq:
      enabled: false
  auth:
    jwt-key: ${JWT_KEY:test-only-change-this-key-to-32-bytes-minimum-123456}
    refresh-token-enabled: false

