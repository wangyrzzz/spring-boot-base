server:
  port: 8080


spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:spring_boot_base;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      password:
      timeout: 2s
      lettuce:
        shutdown-timeout: 100ms
        pool:
          max-active: 8
          max-idle: 8
          max-wait: 30s
          min-idle: 0
sys:
  redisson:
    enabled: false
  auth:
    jwt-key: ${JWT_KEY:test-only-change-this-key-to-32-bytes-minimum-123456}

