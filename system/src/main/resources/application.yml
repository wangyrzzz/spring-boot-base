spring:
  application:
    name: spring-boot-base
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 1
      min-idle: 1
      max-active: 10
      max-wait: 1200
      keep-alive: true
      remove-abandoned: true
      remove-abandoned-timeout: 180
      filters: stat
  data:
    redis:
      timeout: 2s
      lettuce:
        shutdown-timeout: 100ms
        pool:
          max-active: 8
          max-idle: 8
          max-wait: 30s
          min-idle: 0
  rabbitmq:
    template:
      observation-enabled: true
    listener:
      simple:
        observation-enabled: true
  servlet:
    multipart:
      max-file-size: ${SYS_MAX_FILE_SIZE:100MB}
      max-request-size: ${SYS_MAX_REQUEST_SIZE:110MB}

sys:
  mq:
    provider: rabbitmq
    retry:
      fixed-delay-ms: ${SYS_MQ_RETRY_FIXED_DELAY_MS:180000}
      max-attempts: ${SYS_MQ_RETRY_MAX_ATTEMPTS:10}
      batch-size: ${SYS_MQ_RETRY_BATCH_SIZE:100}
      stale-sending-timeout-ms: ${SYS_MQ_RETRY_STALE_TIMEOUT_MS:600000}
  auth:
    jwt-key: ${JWT_KEY:zJN8sR3jPXX7q8N4p8Q9B9rPpXGqjGW9QxA0g8yE8hs=}
    access-token-ttl-seconds: 900
    refresh-token-ttl-seconds: 604800
    refresh-token-enabled: false
  rbac:
    enabled: ${SYS_RBAC_ENABLED:true}
    administrator-bypass: ${SYS_RBAC_ADMINISTRATOR_BYPASS:true}
  redisson:
    type: STANDALONE
    address: 127.0.0.1:6379
    password:
    database: 0
  oss:
    local-root: ${SYS_OSS_LOCAL_ROOT:${java.io.tmpdir}/spring-boot-base-objects}
    public-base-url: ${SYS_OSS_PUBLIC_BASE_URL:}
  infra:
    redis:
      enabled: ${SYS_INFRA_REDIS_ENABLED:false}
    rabbitmq:
      enabled: ${SYS_INFRA_RABBITMQ_ENABLED:false}
    elasticsearch:
      enabled: ${SYS_INFRA_ELASTICSEARCH_ENABLED:false}
  data-scope:
    enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations:
    - classpath:/mapper/**/**.xml

server:
  port: 8080

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
    address: ${MANAGEMENT_ADDRESS:0.0.0.0}
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: false
  tracing:
    enabled: true
    propagation:
      type: w3c
    sampling:
      probability: ${TRACE_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      export:
        enabled: ${TRACE_OTLP_EXPORT_ENABLED:false}

info:
  app:
    name: ${spring.application.name}
    version: ${APP_VERSION:unknown}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

knife4j:
  enable: true
